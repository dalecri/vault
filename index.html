<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault — Cristobal D'Alessio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1E1826; color: #EDE7F2;
    font-family: "Space Mono", ui-monospace, Menlo, monospace;
    min-height: 100vh; padding: 48px 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: #9B8FA8; font-size: 14px; margin: 8px 0 32px; }
  h2 {
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #9B8FA8; margin: 28px 0 12px;
  }
  a.card {
    display: flex; justify-content: space-between; align-items: center;
    background: #2A2233; border: 1px solid #3A3247; border-radius: 14px;
    padding: 18px 20px; margin-bottom: 12px;
    color: #EDE7F2; text-decoration: none;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.card:hover { border-color: #E8873A; transform: translateY(-1px); }
  .card .name { font-size: 16px; font-weight: 700; }
  .card .desc { color: #9B8FA8; font-size: 13px; margin-top: 4px; }
  .card .arrow { color: #E8873A; font-size: 18px; flex-shrink: 0; margin-left: 16px; }
  footer { color: #9B8FA8; font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <h1>Vault</h1>
  <p class="sub">Design, prompts, and quick links. Preview and copy, fast.</p>

  <h2>Quick links</h2>
  <a class="card" href="https://heycristobal.com/ASCII-VISUAL-PROJECTS/">
    <span>
      <span class="name">ASCII Projects</span>
      <div class="desc">Landing page for the ASCII project family</div>
    </span>
    <span class="arrow">&rarr;</span>
  </a>
  <a class="card" href="https://heycristobal.com/landing-templates/">
    <span>
      <span class="name">Landing Templates</span>
      <div class="desc">Reusable landing page templates</div>
    </span>
    <span class="arrow">&rarr;</span>
  </a>

  <footer>More sections land here as they are built.</footer>
</main>
</body>
</html>
